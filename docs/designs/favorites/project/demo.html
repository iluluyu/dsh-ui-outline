<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outline · 收藏演示</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f5;color:#1b1c1e;font:14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}.wrap{max-width:1180px;margin:0 auto;padding:48px 24px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.15em;color:#65676b}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:10px 0 28px}h1{margin:0;font-size:30px;letter-spacing:-.04em}header p,.hint{margin:0;color:#65676b}.app{height:540px;display:flex;background:white;border:1px solid #e3e4e5;border-radius:22px;box-shadow:0 16px 48px #0000000e;overflow:hidden}.sidebar{width:180px;flex:none;background:#fafafa;border-right:1px solid #eee;padding:28px 22px}.sidebar strong{display:block;margin-bottom:24px}.item{padding:10px;border-radius:8px;font-size:12px;color:#75777a;margin-bottom:12px}.item.active{background:#eee;color:#555}.content{flex:1;min-width:0;position:relative;padding:38px 55px;overflow:hidden}.title{color:#73767a;font-size:13px}.question{font-size:18px;font-weight:650;margin-top:38px;max-width:480px}.answer{color:#66696d;margin-top:20px;max-width:440px;line-height:1.9}.rule{max-width:450px;border-top:1px solid #eee;margin:32px 0 24px}.muted{color:#929497;font-size:13px}.preview{position:absolute;right:75px;top:225px;width:min(395px,calc(100% - 95px));padding:21px 54px 23px 23px;background:rgba(255,255,255,.96);border:1px solid #ededee;border-radius:18px;box-shadow:0 12px 35px #0002}.preview h2{font-size:16px;line-height:1.5;margin:0}.preview p{font-size:14px;color:#777a7d;line-height:1.6;margin:10px 0 0}.star{position:absolute;right:9px;top:9px;width:44px;height:44px;border:0;border-radius:9px;background:transparent;cursor:pointer;color:#252729;display:grid;place-items:center}.star:hover{background:#f1f1f1}.star svg{width:20px;height:20px}.rail{position:absolute;right:16px;top:85px;display:flex;flex-direction:column;align-items:flex-end;gap:9px}.tick{height:24px;width:44px;padding:0;display:flex;align-items:center;justify-content:flex-end;gap:4px;border:0;background:transparent;cursor:pointer}.line{width:16px;height:2px;border-radius:3px;background:#d5d6d8}.tick.selected .line{width:24px;height:3px;background:#1e2022}.dot{width:5px;height:5px;border-radius:50%;background:#1e2022;visibility:hidden}.tick.saved .dot{visibility:visible}.hint{display:flex;justify-content:space-between;gap:15px;margin-top:22px;font-size:13px}button:focus-visible{outline:2px solid #345a9d;outline-offset:2px}@media(max-width:650px){.wrap{padding:26px 14px}header{display:block}header p{margin-top:8px}.sidebar{display:none}.content{padding:30px 22px}.preview{top:230px;right:65px}.hint{display:block}.hint span{display:block;margin-top:6px}}
.tick{flex-direction:row-reverse;justify-content:flex-start}.content.left .rail{left:16px;right:auto;align-items:flex-start}.content.left .tick{flex-direction:row;justify-content:flex-start}.content.left .preview{left:75px;right:auto}.side-switch{border:1px solid #dedfe1;background:#fff;color:#303236;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}.side-switch:hover{background:#f7f7f7}@media(max-width:650px){.content.left .preview{left:65px}}
</style>
</head>
<body><main class="wrap"><div class="eyebrow">OUTLINE · INTERACTIVE CONCEPT</div><header><div><h1>把值得回看的轮次留下来</h1><p>收藏卡片，轨道同步标记</p></div><button class="side-switch" id="side-switch" type="button">切换到左侧轨道</button></header>
<div class="app"><aside class="sidebar"><strong>对话</strong><div class="item active">模型训练与对齐</div><div class="item">上下文管理</div><div class="item">工具调用设计</div></aside><section class="content"><div class="title">模型训练与对齐</div><div class="question" id="question"></div><div class="answer" id="answer"></div><div class="rule"></div><div class="muted">继续阅读对话内容…</div><div class="preview"><h2 id="preview-title"></h2><p id="preview-answer"></p><button class="star" id="star" type="button" aria-label="收藏此轮" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.75 5.6 6.18.9-4.47 4.35 1.06 6.15L12 17.1l-5.52 2.9 1.06-6.15L3.07 9.5l6.18-.9z"></path></svg></button></div><nav class="rail" aria-label="轮次导航" id="rail"></nav></section></div>
<div class="hint"><span>点击星标收藏；切换左右轨道，圆点始终朝向正文。</span><span>演示数据仅保存在当前浏览器，不会修改真实对话。</span></div></main>
<script>
const turns=[['如何准备训练数据？','先明确数据质量标准，确保数据来源、标注和覆盖范围可追溯。'],['对齐阶段的数据配比一般怎么定？','没有通用比例。通常先用足量高质量数据建立基础能力，再用偏好数据进行对齐。'],['如何评估模型表现？','结合自动评测与人工评估，并针对实际任务建立稳定的回归集。'],['怎样处理长上下文？','优先保留相关信息，并通过检索和摘要控制上下文长度。'],['如何降低推理成本？','从模型大小、缓存复用和批处理等方面逐步优化。']];
let selected=1;let saved;try{saved=JSON.parse(localStorage.getItem('outline-favorites-demo')||'[]')}catch{saved=[]}if(!Array.isArray(saved))saved=[];
const rail=document.querySelector('#rail'),star=document.querySelector('#star');
function render(){const [q,a]=turns[selected];document.querySelector('#question').textContent=q;document.querySelector('#answer').textContent=a;document.querySelector('#preview-title').textContent=q;document.querySelector('#preview-answer').textContent=a;const isSaved=saved.includes(selected);star.setAttribute('aria-pressed',String(isSaved));star.setAttribute('aria-label',isSaved?'取消收藏':'收藏此轮');star.querySelector('svg').setAttribute('fill',isSaved?'currentColor':'none');rail.replaceChildren(...turns.map((turn,i)=>{const button=document.createElement('button');button.type='button';button.className='tick'+(selected===i?' selected':'')+(saved.includes(i)?' saved':'');button.setAttribute('aria-label',`第 ${i+1} 轮：${turn[0]}${saved.includes(i)?'，已收藏':''}`);button.innerHTML='<span class="line"></span><span class="dot"></span>';button.addEventListener('click',()=>{selected=i;render()});return button}))}
star.addEventListener('click',()=>{saved=saved.includes(selected)?saved.filter(i=>i!==selected):[...saved,selected];try{localStorage.setItem('outline-favorites-demo',JSON.stringify(saved))}catch{}render()});document.querySelector('#side-switch').addEventListener('click',event=>{const left=document.querySelector('.content').classList.toggle('left');event.currentTarget.textContent=left?'切换到右侧轨道':'切换到左侧轨道'});render();
</script></body></html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="dsh-ui-outline marks">
  <style>
    .mark { fill: rgba(15, 17, 21, .38); }
    .hot  { fill: #0f1115; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: rgba(173, 178, 184, .38); }
      .hot  { fill: #f9fafb; }
    }
  </style>
  <!-- the wave: one hovered mark stretched full-length, neighbors decaying.
       Right-aligned, as the rail draws it against the column gutter. -->
  <rect class="mark" x="26" y="18" width="8"  height="3" rx="1.5"/>
  <rect class="mark" x="20" y="28" width="14" height="3" rx="1.5"/>
  <rect class="hot"  x="10" y="38" width="24" height="3" rx="1.5"/>
  <rect class="mark" x="20" y="48" width="14" height="3" rx="1.5"/>
  <rect class="mark" x="26" y="58" width="8"  height="3" rx="1.5"/>
</svg>

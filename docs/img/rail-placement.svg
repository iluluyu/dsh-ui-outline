<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" aria-label="Rail placement and density: loose 30px pitch on left edge, compact 10px pitch on right edge with hover wave and glass preview">
  <style>
    .scene { fill: #edf0f3; stroke: rgba(0,0,0,.08); }
    .surface { fill: #fff; stroke: rgba(0,0,0,.09); }
    .label { font-size: 13px; font-weight: 600; fill: #81858c; letter-spacing: .05em; }
    .prompt { fill: rgba(15,17,21,.46); }
    .resp { fill: rgba(97,102,107,.24); }
    .respDim { fill: rgba(97,102,107,.14); }
    .cardGlass { fill: rgba(255,255,255,.32); }
    .cardRing { stroke: rgba(0,0,0,.13); fill: none; }
    .rim { stroke: url(#rimGrad); }
    .cardRim { stroke: url(#cardRimGrad); }
    .sheen { fill: url(#sheenGrad); }
    .foldBar { fill: rgba(97,102,107,.55); }
    .foldBar2 { fill: rgba(97,102,107,.32); }
    .cardPrompt { fill: rgba(15,17,21,.8); }
    .cardResp { fill: rgba(15,17,21,.45); }
    .markIdle { fill: rgba(129,133,140,.4); }
    .markOn { fill: #0f1115; }
    .markNear { fill: rgba(15,17,21,.65); }
    .markBrand { fill: #4d6bfe; }
    .ink { fill: #0f1115; }
    @media (prefers-color-scheme: dark) {
      .scene { fill: #101113; stroke: rgba(255,255,255,.09); }
      .surface { fill: #1c1d1f; stroke: rgba(255,255,255,.1); }
      .label { fill: #9da2a8; }
      .prompt { fill: rgba(249,250,251,.44); }
      .resp { fill: rgba(166,171,178,.24); }
      .respDim { fill: rgba(166,171,178,.14); }
      .cardGlass { fill: rgba(35,35,36,.34); }
      .cardRing { stroke: rgba(255,255,255,.15); }
      .rim { stroke: url(#rimGradD); }
      .cardRim { stroke: url(#cardRimGradD); }
      .foldBar { fill: rgba(166,171,178,.8); }
      .foldBar2 { fill: rgba(166,171,178,.45); }
      .cardPrompt { fill: rgba(249,250,251,.88); }
      .cardResp { fill: rgba(249,250,251,.55); }
      .markIdle { fill: rgba(173,178,184,.38); }
      .markOn { fill: #f9fafb; }
      .markNear { fill: rgba(249,250,251,.65); }
      .ink { fill: #f9fafb; }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }

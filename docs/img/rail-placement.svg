<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" aria-label="Rail placement and density: loose 30px pitch on the left edge, compact 10px pitch on the right edge with scroll fade, hover wave, and a liquid-glass preview">
  <style>
    .scene { fill: #edf0f3; stroke: rgba(0,0,0,.08); stroke-width: 1; }
    .surface { fill: #ffffff; stroke: rgba(0,0,0,.09); stroke-width: 1; }
    .sheet { fill: #ffffff; }
    .paper { fill: rgba(15,17,21,.5); font-size: 12px; }
    .body { fill: rgba(15,17,21,.8); }
    .sub { fill: rgba(15,17,21,.65); }
    .glass { fill: rgba(255,255,255,.25); }
    .rim { fill: none; stroke: rgb(255,255,255,.62); stroke-width: 1.5; stroke-linejoin: round; }
    .label { font-size: 13px; font-weight: 600; fill: #81858c; letter-spacing: .05em; }
    .markIdle { fill: rgba(129,133,140,.4); }
    .markOn { fill: #0f1115; }
    .markNear { fill: rgba(15,17,21,.65); }
    .markBrand { fill: #4d6bfe; }
    .cursor { fill: #0f1115; stroke: #fff; stroke-width: 1.15; stroke-linejoin: round; }
    .sum { font-size: 10px; }
    .float { filter: url(#sh); }
    text { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .scene { fill: #101113; stroke: rgba(255,255,255,.09); }
      .surface, .sheet { fill: #1c1d1f; }
      .surface { stroke: rgba(255,255,255,.1); }
      .paper { fill: rgba(249,250,251,.5); }
      .body { fill: rgba(249,250,251,.88); }
      .sub { fill: rgba(249,250,251,.72); }
      .glass { fill: rgba(35,35,36,.25); }
      .rim { stroke: rgb(255,255,255,.34); }
      .label { fill: #9da2a8; }
      .markIdle { fill: rgba(173,178,184,.38); }
      .markOn { fill: #f9fafb; }
      .markNear { fill: rgba(249,250,251,.65); }
      .cursor { fill: #f9fafb; stroke: #101113; }
      .float { filter: url(#shD); }
      #endFade stop { stop-color: #1c1d1f; }
    }
  </style>
  <defs>
    <filter id="sh" x="-70%" y="-120%" width="240%" height="360%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".12"/>
    </filter>
    <filter id="shD" x="-70%" y="-120%" width="240%" height="360%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".36"/>
    </filter>
    <filter id="lens" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
      <feColorMatrix type="saturate" values="1.8"/>
    </filter>
    <linearGradient id="endFade" gradientUnits="userSpaceOnUse" x1="0" y1="46" x2="0" y2="234">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="13%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="87%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="scrollFade">
      <rect x="815" y="46" width="40" height="188" fill="url(#endFade)"/>
    </mask>
    <mask id="hole" maskUnits="userSpaceOnUse" x="0" y="0" width="880" height="260">
      <rect width="880" height="260" fill="#fff"/>
      <rect x="618" y="86" width="194" height="84" rx="14" fill="#000"/>
    </mask>
    <mask id="ring" maskUnits="userSpaceOnUse" x="0" y="0" width="880" height="260">
      <rect width="880" height="260" fill="#fff"/>
      <rect x="618" y="86" width="194" height="84" rx="14" fill="#000"/>
    </mask>
    <clipPath id="clipCard"><rect x="618" y="86" width="194" height="84" rx="14"/></clipPath>
  </defs>
  <rect class="scene" x="1" y="1" width="878" height="258" rx="14"/>
  <text class="label" x="26" y="27">loose</text>
  <text class="label" x="454" y="27">compact</text>
  <rect class="surface" x="24" y="38" width="404" height="204" rx="14"/>
  <g class="paper">
    <text x="66" y="62">We propose a new simple network architecture, the Transformer,</text>
    <text x="66" y="78">based solely on attention mechanisms, dispensing with recurrence</text>
    <text x="66" y="94">and convolutions entirely.</text>
    <text x="66" y="110">The dominant sequence transduction models are based on complex</text>
    <text x="66" y="126">recurrent or convolutional neural networks.</text>
    <text x="66" y="142">Attention is all you need.</text>
    <text x="66" y="158">Experiments on two machine translation tasks show these</text>
    <text x="66" y="174">models to be superior in quality while being more</text>
    <text x="66" y="190">parallelizable and requiring significantly less time to train.</text>
    <text x="66" y="206">Our model achieves 28.4 BLEU on the WMT 2014</text>
    <text x="66" y="222">translation task, improving over the existing best results.</text>
  </g>
  <g>
    <rect class="markIdle" x="38" y="58.75" width="6" height="2.5" rx="1.25"/>
    <rect class="markIdle" x="38" y="88.75" width="6" height="2.5" rx="1.25"/>
    <rect class="markBrand" x="38" y="117.5" width="16" height="3.5" rx="1.75"/>
    <rect class="markIdle" x="38" y="148.75" width="6" height="2.5" rx="1.25"/>
    <rect class="markIdle" x="38" y="178.75" width="6" height="2.5" rx="1.25"/>
    <rect class="markIdle" x="38" y="208.75" width="6" height="2.5" rx="1.25"/>
  </g>
  <g mask="url(#hole)">
    <rect class="surface" x="452" y="38" width="404" height="204" rx="14"/>
    <g class="paper">
      <text x="474" y="62">Experiments on two machine translation tasks show these</text>
      <text x="474" y="78">models to be superior in quality while being more</text>
      <text x="474" y="94">parallelizable and</text>
      <text x="474" y="110">requiring significantly</text>
      <text x="474" y="126">less time to train.</text>
      <text x="474" y="142">Our model achieves</text>
      <text x="474" y="158">28.4 BLEU on the</text>
      <text x="474" y="174">English-to-German</text>
      <text x="474" y="190">We propose a new simple network architecture, the Transformer,</text>
      <text x="474" y="206">based solely on attention mechanisms, dispensing with recurrence</text>
      <text x="474" y="222">and convolutions entirely.</text>
    </g>
  </g>
  <g class="float" mask="url(#ring)">
    <rect x="618" y="86" width="194" height="84" rx="14" fill="#000"/>
  </g>
  <g clip-path="url(#clipCard)">
    <g filter="url(#lens)">
      <rect class="sheet" x="598" y="66" width="234" height="124"/>
      <g class="paper">
        <text x="474" y="94">parallelizable and requiring significantly less time to train.</text>
        <text x="474" y="110">Our model achieves 28.4 BLEU on the WMT 2014</text>
        <text x="474" y="126">English-to-German translation task, improving over the existing best results.</text>
        <text x="474" y="142">We propose a new simple network architecture, the Transformer,</text>
        <text x="474" y="158">based solely on attention mechanisms, dispensing with recurrence</text>
      </g>
    </g>
    <rect class="glass" x="618" y="86" width="194" height="84" rx="14"/>
  </g>
  <rect class="rim" x="618" y="86" width="194" height="84" rx="14"/>
  <g class="sum">
    <text class="body" x="632" y="108">We present a residual learning</text>
    <text class="body" x="632" y="124">framework to ease the training</text>
    <text class="sub" x="632" y="140">of networks that are</text>
    <text class="sub" x="632" y="156">substantially deeper.</text>
  </g>
  <g mask="url(#scrollFade)">
    <rect class="markIdle" x="838" y="55" width="6" height="2.5" rx="1.25"/>
    <rect class="markIdle" x="838" y="65" width="6" height="2.5" rx="1.25"/>
    <rect class="markIdle" x="838" y="75" width="6" height="2.5" rx="1.25"/>
    <rect class="markIdle" x="838" y="85" width="6" height="2.5" rx="1.25"/>
    <rect class="markIdle" x="837" y="95" width="7" height="2.5" rx="1.25"/>
    <rect class="markNear" x="834" y="105" width="10" height="2.5" rx="1.25"/>
    <rect class="markNear" x="829" y="115" width="15" height="2.5" rx="1.25"/>
    <rect class="markOn" x="824" y="125" width="20" height="2.5" rx="1.25"/>
    <rect class="markNear" x="829" y="135" width="15" height="2.5" rx="1.25"/>
    <rect class="markNear" x="834" y="145" width="10" height="2.5" rx="1.25"/>
    <rect class="markIdle" x="837" y="155" width="7" height="2.5" rx="1.25"/>
    <rect class="markIdle" x="838" y="165" width="6" height="2.5" rx="1.25"/>
    <rect class="markIdle" x="838" y="175" width="6" height="2.5" rx="1.25"/>
    <rect class="markBrand" x="832" y="184.75" width="12" height="3" rx="1.5"/>
    <rect class="markIdle" x="838" y="195" width="6" height="2.5" rx="1.25"/>
    <rect class="markIdle" x="838" y="205" width="6" height="2.5" rx="1.25"/>
    <rect class="markIdle" x="838" y="215" width="6" height="2.5" rx="1.25"/>
    <rect class="markIdle" x="838" y="225" width="6" height="2.5" rx="1.25"/>
  </g>
  <path d="M848 126 l10 4-4.2 1 2.8 5.2-1.9 1-2.8-5.2-3.5 2.1z" class="cursor" paint-order="stroke"/>
</svg>

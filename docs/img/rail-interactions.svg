<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-label="Rail interactions: the current turn stays on a solid brand row while the dashed cursor, glass preview, and pointer walk with the wheel">
  <style>
    .scene { fill: #edf0f3; stroke: rgba(0,0,0,.08); stroke-width: 1; }
    .surface { fill: #ffffff; stroke: rgba(0,0,0,.09); stroke-width: 1; }
    .sheet { fill: #ffffff; }
    .paper { fill: rgba(15,17,21,.5); font-size: 12px; }
    .body { fill: rgba(15,17,21,.8); }
    .sub { fill: rgba(15,17,21,.65); }
    .glass { fill: rgba(255,255,255,.25); }
    .rim { fill: none; stroke: rgb(255,255,255,.62); stroke-width: 1.5; stroke-linejoin: round; }
    .markIdle { fill: rgba(129,133,140,.4); }
    .markOn { fill: #0f1115; }
    .markNear { fill: rgba(15,17,21,.65); }
    .markBrand { fill: #4d6bfe; }
    .cursor { fill: #0f1115; stroke: #fff; stroke-width: 1.15; stroke-linejoin: round; }
    .icon { fill: none; stroke: #61666b; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .sum { font-size: 11px; }
    .row { font-size: 11px; }
    .float { filter: url(#sh); }
    text { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .scene { fill: #101113; stroke: rgba(255,255,255,.09); }
      .surface, .sheet { fill: #1c1d1f; }
      .surface { stroke: rgba(255,255,255,.1); }
      .paper { fill: rgba(249,250,251,.5); }
      .body { fill: rgba(249,250,251,.88); }
      .sub { fill: rgba(249,250,251,.72); }
      .glass { fill: rgba(35,35,36,.25); }
      .rim { stroke: rgb(255,255,255,.34); }
      .markIdle { fill: rgba(173,178,184,.38); }
      .markOn { fill: #f9fafb; }
      .markNear { fill: rgba(249,250,251,.65); }
      .cursor { fill: #f9fafb; stroke: #101113; }
      .icon { stroke: #9da2a8; }
      .float { filter: url(#shD); }
    }
  </style>
  <defs>
    <filter id="sh" x="-70%" y="-120%" width="240%" height="360%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".12"/>
    </filter>
    <filter id="shD" x="-70%" y="-120%" width="240%" height="360%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".36"/>
    </filter>
    <filter id="lens" x="-20%" y="-30%" width="140%" height="170%">
      <feGaussianBlur stdDeviation="4"/>
      <feColorMatrix type="saturate" values="1.8"/>
    </filter>
    <mask id="hole" maskUnits="userSpaceOnUse" x="0" y="0" width="880" height="280">
      <rect width="880" height="280" fill="#fff"/>
      <rect x="430" y="148" width="200" height="88" rx="14" fill="#000"/>
    </mask>
    <mask id="ring" maskUnits="userSpaceOnUse" x="0" y="0" width="880" height="280">
      <rect width="880" height="280" fill="#fff"/>
      <rect x="430" y="148" width="200" height="88" rx="14" fill="#000"/>
    </mask>
    <clipPath id="clipCard"><rect x="430" y="148" width="200" height="88" rx="14"/></clipPath>
  </defs>
  <rect class="scene" x="1" y="1" width="878" height="278" rx="14"/>
  <g mask="url(#hole)">
    <rect class="surface" x="24" y="38" width="676" height="204" rx="14"/>
    <g class="paper">
      <text x="66" y="58">The dominant sequence transduction models are based on complex</text>
      <text x="66" y="74">based solely on attention mechanisms, dispensing with recurrence</text>
      <text x="66" y="130">and convolutions entirely.</text>
      <text x="66" y="146">Attention is all you need.</text>
      <text x="66" y="204">Experiments on two machine translation tasks show these</text>
      <text x="66" y="220">models to be superior in quality</text>
    </g>
    <g>
      <rect x="46" y="84" width="440" height="30" rx="8" fill="rgba(77,107,254,.1)"/>
      <rect x="46" y="90" width="3.5" height="18" rx="1.75" fill="#4d6bfe"/>
      <text class="body row" x="62" y="103">We propose a new simple network architecture, the Transformer,</text>
    </g>
    <g>
      <rect x="46" y="158" width="440" height="30" rx="8" fill="none" stroke="#4d6bfe" stroke-width="1.5" stroke-dasharray="5 4" stroke-linejoin="round"/>
      <text class="body row" x="62" y="177">recurrent or convolutional neural networks.</text>
    </g>
  </g>
  <g class="float" mask="url(#ring)">
    <rect x="430" y="148" width="200" height="88" rx="14" fill="#000"/>
  </g>
  <g clip-path="url(#clipCard)">
    <g filter="url(#lens)">
      <rect class="sheet" x="410" y="128" width="240" height="128"/>
      <g class="paper">
        <text x="446" y="156">Attention is all you need.</text>
        <text x="446" y="230">and convolutions entirely.</text>
      </g>
    </g>
    <rect class="glass" x="430" y="148" width="200" height="88" rx="14"/>
  </g>
  <rect class="rim" x="430" y="148" width="200" height="88" rx="14"/>
  <g class="sum">
    <text class="body" x="446" y="166">We introduce a new language</text>
    <text class="body" x="446" y="182">representation model called BERT,</text>
    <text class="sub" x="446" y="198">designed to pre-train deep</text>
    <text class="sub" x="446" y="214">bidirectional representations.</text>
  </g>
  <g>
    <rect class="markIdle" x="688" y="56" width="6" height="2.5" rx="1.25"/>
    <rect class="markIdle" x="688" y="70" width="6" height="2.5" rx="1.25"/>
    <rect class="markBrand" x="672" y="97.5" width="16" height="3.5" rx="1.75"/>
    <rect class="markIdle" x="688" y="128" width="6" height="2.5" rx="1.25"/>
    <rect class="markIdle" x="688" y="142" width="6" height="2.5" rx="1.25"/>
    <rect class="markNear" x="684" y="156" width="10" height="2.5" rx="1.25"/>
    <rect class="markOn" x="674" y="170" width="20" height="2.5" rx="1.25"/>
    <rect class="markNear" x="684" y="184" width="10" height="2.5" rx="1.25"/>
    <rect class="markIdle" x="688" y="198" width="6" height="2.5" rx="1.25"/>
    <rect class="markIdle" x="688" y="212" width="6" height="2.5" rx="1.25"/>
    <rect class="markIdle" x="688" y="226" width="6" height="2.5" rx="1.25"/>
  </g>
  <path d="M700 171 l11 4.2-4.6 1.1 3.1 5.6-2.1 1.15-3.1-5.6-3.9 2.3z" class="cursor" paint-order="stroke"/>
  <g class="icon">
    <rect x="742" y="118" width="20" height="34" rx="10"/>
    <line x1="752" y1="126" x2="752" y2="138"/>
    <path d="M746 106 l6-6 6 6"/>
    <path d="M746 164 l6 6 6-6"/>
  </g>
  <g fill="none" stroke="#4d6bfe" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M324 188 h10 m-4-4 4 4-4 4"/>
    <path d="M324 158 h-10 m4-4-4 4 4 4"/>
  </g>
</svg>

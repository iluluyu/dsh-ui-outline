<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-label="Hover the right-edge rail to preview a turn: nearby ticks grow into a wave and a glass card shows Prompt and Response. The conversation stays put — current turn highlighted, preview turn dashed. Scroll the wheel to step the preview, then click to jump.">
  <title>Hover preview, wheel step, click to jump</title>
  <desc>Turn rail interactions: hover wave with a glass preview card, wheel stepping one turn at a time, click to jump. The conversation does not move while the preview walks.</desc>
  <style>
    text { font-family: system-ui, sans-serif; }
    .scene { fill: #edf0f3; }
    .col { fill: #fff; stroke: rgba(0,0,0,.1); stroke-width: 1; }
    .prompt { fill: rgba(15,17,21,.46); }
    .resp { fill: rgba(97,102,107,.24); }
    .dim { fill: rgba(97,102,107,.14); }
    .idle { fill: #81858c; }
    .on { fill: #0f1115; fill-opacity: .7; }
    .hot { fill: #0f1115; }
    .near { fill: #0f1115; fill-opacity: .55; }
    .ink { fill: #0f1115; }
    .sub { fill: #61666b; }
    .card { fill: #fff; }
    .brand { fill: #4d6bfe; }
  </style>
  <defs>
    <filter id="lift" x="-40%" y="-45%" width="180%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity=".16"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".08"/>
    </filter>
    <linearGradient id="rim" x1="0" y1="0" x2=".85" y2=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".42" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d6bfe" stop-opacity=".06"/>
      <stop offset="1" stop-color="#4d6bfe" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clipPrev"><rect x="300" y="128" width="182" height="106" rx="18.4"/></clipPath>
  </defs>

  <rect class="scene" x="1" y="1" width="878" height="278" rx="16"/>

  <text class="ink" x="16" y="30" font-size="20" font-weight="600">Hover preview</text>
  <text class="ink" x="548" y="30" font-size="20" font-weight="600">Scroll to preview</text>

  <!-- conversation column, right-edge rail. Session stays; preview walks. -->
  <rect class="col" x="16" y="40" width="508" height="224" rx="12"/>

  <!-- current turn: solid highlight. Preview turn: dashed. Not the same row. -->
  <rect x="28" y="80" width="228" height="34" rx="8" fill="rgba(77,107,254,.1)"/>
  <rect x="34" y="89" width="3" height="16" rx="1.5" fill="#4d6bfe"/>
  <rect x="28" y="166" width="228" height="30" rx="8" fill="none" stroke="#4d6bfe" stroke-width="1.5" stroke-dasharray="4 3" stroke-linejoin="round"/>

  <g>
    <rect class="prompt" x="44" y="60" width="132" height="8" rx="4"/>
    <rect class="resp" x="44" y="72" width="96" height="6" rx="3"/>
    <rect class="prompt" x="44" y="88" width="112" height="8" rx="4"/>
    <rect class="resp" x="44" y="100" width="78" height="6" rx="3"/>
    <rect class="prompt" x="44" y="116" width="148" height="8" rx="4"/>
    <rect class="resp" x="44" y="128" width="110" height="6" rx="3"/>
    <rect class="dim" x="44" y="138" width="64" height="5" rx="2.5"/>
    <rect class="prompt" x="44" y="144" width="156" height="8" rx="4"/>
    <rect class="resp" x="44" y="156" width="118" height="6" rx="3"/>
    <rect class="prompt" x="44" y="172" width="104" height="8" rx="4"/>
    <rect class="resp" x="44" y="184" width="72" height="6" rx="3"/>
    <rect class="prompt" x="44" y="204" width="140" height="8" rx="4"/>
    <rect class="resp" x="44" y="216" width="104" height="6" rx="3"/>
    <rect class="prompt" x="44" y="228" width="124" height="8" rx="4"/>
    <rect class="resp" x="44" y="240" width="88" height="6" rx="3"/>
  </g>
  <text class="ink" x="256" y="102" text-anchor="end" font-size="20" font-weight="600">Current</text>
  <text class="brand" x="256" y="186" text-anchor="end" font-size="20" font-weight="600">Preview</text>

  <!-- glass card: bright rim, top sheen, Prompt / Response summary bars. 10px clear of the hot mark. -->
  <g filter="url(#lift)">
    <rect class="card" x="300" y="128" width="182" height="106" rx="18.4"/>
  </g>
  <g clip-path="url(#clipPrev)">
    <rect fill="url(#sheen)" x="300" y="128" width="182" height="40"/>
  </g>
  <rect x="300.5" y="128.5" width="181" height="105" rx="18" fill="none" stroke="rgba(0,0,0,.1)" stroke-width="1"/>
  <rect x="300.5" y="128.5" width="181" height="105" rx="18" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
  <g>
    <text class="ink" x="312" y="150" font-size="20" font-weight="600">Prompt</text>
    <rect class="ink" x="312" y="158" width="124" height="7" rx="3.5"/>
    <rect class="ink" x="312" y="169" width="84" height="7" rx="3.5"/>
    <text class="sub" x="312" y="192" font-size="20" font-weight="500">Response</text>
    <rect class="sub" x="312" y="200" width="142" height="6" rx="3" opacity=".75"/>
    <rect class="sub" x="312" y="210" width="98" height="6" rx="3" opacity=".45"/>
  </g>

  <!-- hover wave: ticks near the pointer grow. Hot mark lines up with the dashed preview turn. -->
  <g>
    <rect class="idle" x="506" y="68" width="6" height="2.5" rx="1.25"/>
    <rect class="on" x="506" y="96" width="6" height="2.5" rx="1.25"/>
    <rect class="near" x="500" y="124" width="12" height="2.5" rx="1.25"/>
    <rect class="near" x="496" y="152" width="16" height="2.5" rx="1.25"/>
    <rect class="hot" x="492" y="180" width="20" height="2.5" rx="1.25"/>
    <rect class="near" x="496" y="208" width="16" height="2.5" rx="1.25"/>
    <rect class="near" x="500" y="236" width="12" height="2.5" rx="1.25"/>
  </g>
  <path d="M516 181 l11 4.2-4.6 1.1 3.1 5.6-2.1 1.15-3.1-5.6-3.9 2.3z" fill="#0f1115" stroke="#fff" stroke-width="1.15" stroke-linejoin="round" paint-order="stroke"/>

  <!-- wheel step: cursor advances one turn per frame (dark → bright → dark, bright steps down). -->
  <g>
    <rect x="548" y="108" width="16" height="26" rx="8" fill="none" stroke="#61666b" stroke-width="1.6"/>
    <line x1="556" y1="115" x2="556" y2="124" stroke="#61666b" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M550 142 l6 5 6-5" fill="none" stroke="#61666b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect class="col" x="582" y="64" width="54" height="108" rx="8"/>
  <rect class="col" x="656" y="64" width="54" height="108" rx="8"/>
  <rect class="col" x="730" y="64" width="54" height="108" rx="8"/>
  <g>
    <rect class="on" x="624" y="80" width="6" height="2.5" rx="1.25"/>
    <rect class="hot" x="610" y="96" width="20" height="2.5" rx="1.25"/>
    <rect class="near" x="618" y="112" width="12" height="2.5" rx="1.25"/>
    <rect class="idle" x="624" y="128" width="6" height="2.5" rx="1.25"/>
    <rect class="idle" x="624" y="144" width="6" height="2.5" rx="1.25" opacity=".45"/>
    <rect class="on" x="698" y="80" width="6" height="2.5" rx="1.25"/>
    <rect class="near" x="692" y="96" width="12" height="2.5" rx="1.25"/>
    <rect class="hot" x="684" y="112" width="20" height="2.5" rx="1.25"/>
    <rect class="near" x="692" y="128" width="12" height="2.5" rx="1.25"/>
    <rect class="idle" x="698" y="144" width="6" height="2.5" rx="1.25" opacity=".65"/>
    <rect class="on" x="772" y="80" width="6" height="2.5" rx="1.25"/>
    <rect class="idle" x="770" y="96" width="8" height="2.5" rx="1.25"/>
    <rect class="near" x="766" y="112" width="12" height="2.5" rx="1.25"/>
    <rect class="hot" x="758" y="128" width="20" height="2.5" rx="1.25"/>
    <rect class="near" x="762" y="144" width="16" height="2.5" rx="1.25"/>
  </g>
  <path d="M642 118 h8 m-3.2-3.2 3.2 3.2-3.2 3.2" fill="none" stroke="#61666b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M716 118 h8 m-3.2-3.2 3.2 3.2-3.2 3.2" fill="none" stroke="#61666b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the fixed current mark and the stepping preview read together -->
  <text class="sub" x="683" y="198" text-anchor="middle" font-size="20">Current stays &#183; preview walks</text>
  <text class="ink" x="683" y="228" text-anchor="middle" font-size="20" font-weight="600">Click to jump</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="Turn outline rail: hover wave and a liquid-glass preview card over the conversation">
  <!-- Liquid card matches lib/client.js: veil .25, blur 4, saturate 1.8,
       uniform rim, one soft shadow. No glint, sheen, Fresnel, or fold. -->
  <style>
    .scene { fill: #edf0f3; stroke: rgba(0, 0, 0, .08); }
    .surface { fill: #ffffff; stroke: rgba(0, 0, 0, .09); }
    .paper { fill: rgba(15, 17, 21, .5); }
    .glass { fill: rgba(255, 255, 255, .25); }
    .rim { fill: none; stroke: rgba(255, 255, 255, .62); }
    .cardPrompt { fill: rgba(15, 17, 21, .8); font-weight: 500; }
    .cardResp { fill: rgba(15, 17, 21, .65); }
    .markIdle { fill: rgba(129, 133, 140, .40); }
    .markOn { fill: #0f1115; }
    .markHot { fill: rgba(15, 17, 21, .70); }
    #glassShadow feDropShadow { flood-opacity: .12; }
    @media (prefers-color-scheme: dark) {
      .scene { fill: #101113; stroke: rgba(255, 255, 255, .09); }
      .surface { fill: #1c1d1f; stroke: rgba(255, 255, 255, .10); }
      .paper { fill: rgba(249, 250, 251, .5); }
      .glass { fill: rgba(35, 35, 36, .25); }
      .rim { stroke: rgba(255, 255, 255, .34); }
      .cardPrompt { fill: rgba(249, 250, 251, .88); }
      .cardResp { fill: rgba(249, 250, 251, .72); }
      .markIdle { fill: rgba(173, 178, 184, .38); }
      .markOn { fill: #f9fafb; }
      .markHot { fill: #d9dde2; }
      #glassShadow feDropShadow { flood-opacity: .36; }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  </style>
  <defs>
    <filter id="lens" color-interpolation-filters="sRGB" x="-8%" y="-12%" width="116%" height="130%">
      <feGaussianBlur stdDeviation="4"/>
      <feColorMatrix type="saturate" values="1.8"/>
    </filter>
    <filter id="glassShadow" color-interpolation-filters="sRGB" x="-40%" y="-30%" width="180%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".12" result="sh"/>
      <feComposite in="sh" in2="SourceAlpha" operator="out"/>
    </filter>
    <clipPath id="clipCol"><rect x="68" y="32" width="584" height="256"/></clipPath>
    <clipPath id="clipCard"><rect x="304" y="96" width="280" height="104" rx="18"/></clipPath>
  </defs>

  <rect class="scene" x="1" y="1" width="758" height="318" rx="14"/>

  <g id="column">
    <rect class="surface" x="56" y="24" width="640" height="272" rx="12"/>
    <g class="paper" clip-path="url(#clipCol)" font-size="12">
      <text x="108" y="52">We propose a new simple network architecture, the Transformer,</text>
      <text x="108" y="68">based solely on attention mechanisms, dispensing with recurrence</text>
      <text x="108" y="84">and convolutions entirely.</text>
      <text x="108" y="100">The dominant sequence transduction models are based on complex</text>
      <text x="108" y="116">recurrent or convolutional neural networks.</text>
      <text x="108" y="132">Attention is all you need.</text>
      <text x="108" y="164">We propose a new simple network architecture, the Transformer,</text>
      <text x="108" y="180">based solely on attention mechanisms, dispensing with recurrence</text>
      <text x="108" y="196">and convolutions entirely.</text>
      <text x="108" y="212">The dominant sequence transduction models are based on complex</text>
      <text x="108" y="228">recurrent or convolutional neural networks.</text>
      <text x="108" y="244">Attention is all you need.</text>
      <text x="108" y="276">We propose a new simple network architecture, the Transformer,</text>
    </g>
  </g>

  <g id="float">
    <animate attributeName="opacity" values="1; 1; 1; 1; 0; 0; 1" keyTimes="0; .34; .42; .76; .82; .90; 1" dur="4.2s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 0; 0 38; 0 38; 0 38; 0 38; 0 0" keyTimes="0; .34; .42; .76; .82; .90; 1" dur="4.2s" repeatCount="indefinite"/>
      <g clip-path="url(#clipCard)">
        <g filter="url(#lens)">
          <g>
            <animateTransform attributeName="transform" type="translate" values="0 0; 0 0; 0 -38; 0 -38; 0 -38; 0 -38; 0 0" keyTimes="0; .34; .42; .76; .82; .90; 1" dur="4.2s" repeatCount="indefinite"/>
            <use href="#column" xlink:href="#column"/>
          </g>
        </g>
      </g>
      <g filter="url(#glassShadow)">
        <rect x="304" y="96" width="280" height="104" rx="18" fill="#fff"/>
      </g>
      <rect class="glass" x="304" y="96" width="280" height="104" rx="18"/>
      <rect class="rim" x="304" y="96" width="280" height="104" rx="18" stroke-width="1.5"/>
      <text class="cardPrompt" x="318" y="116" font-size="12">We introduce a new language</text>
      <text class="cardPrompt" x="318" y="132" font-size="12">representation model called BERT.</text>
      <text class="cardResp" x="318" y="154" font-size="11.5">BERT is designed to pre-train deep</text>
      <text class="cardResp" x="318" y="169" font-size="11.5">bidirectional representations from</text>
    </g>
  </g>

  <g>
    <rect class="markIdle" x="681" y="52" width="7" height="2.5" rx="1.25">
      <animate attributeName="width" values="7;7;9;9;7;7" keyTimes="0;.34;.42;.76;.82;1" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="x" values="681;681;679;679;681;681" keyTimes="0;.34;.42;.76;.82;1" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <rect class="markIdle" x="672" y="94" width="16" height="2.5" rx="1.25">
      <animate attributeName="width" values="16;16;14;14;16;16" keyTimes="0;.34;.42;.76;.82;1" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="x" values="672;672;674;674;672;672" keyTimes="0;.34;.42;.76;.82;1" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <rect class="markHot" x="672" y="94" width="16" height="2.5" rx="1.25">
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;.34;.42;.76;.82;1" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="width" values="16;16;14;14;16;16" keyTimes="0;.34;.42;.76;.82;1" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="x" values="672;672;674;674;672;672" keyTimes="0;.34;.42;.76;.82;1" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <rect class="markIdle" x="677" y="136" width="11" height="2.5" rx="1.25">
      <animate attributeName="width" values="11;11;22;22;11;11" keyTimes="0;.34;.42;.76;.82;1" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="x" values="677;677;666;666;677;677" keyTimes="0;.34;.42;.76;.82;1" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <rect class="markHot" x="677" y="136" width="11" height="2.5" rx="1.25" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.34;.42;.76;.82;1" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="width" values="11;11;22;22;11;11" keyTimes="0;.34;.42;.76;.82;1" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="x" values="677;677;666;666;677;677" keyTimes="0;.34;.42;.76;.82;1" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <rect class="markIdle" x="680" y="178" width="8" height="2.5" rx="1.25">
      <animate attributeName="width" values="8;8;14;14;8;8" keyTimes="0;.34;.42;.76;.82;1" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="x" values="680;680;674;674;680;680" keyTimes="0;.34;.42;.76;.82;1" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <rect class="markIdle" x="681.5" y="220" width="6.5" height="2.5" rx="1.25">
      <animate attributeName="width" values="6.5;6.5;9;9;6.5;6.5" keyTimes="0;.34;.42;.76;.82;1" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="x" values="681.5;681.5;679;679;681.5;681.5" keyTimes="0;.34;.42;.76;.82;1" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <rect class="markOn" x="680" y="261.5" width="8" height="3" rx="1.5"/>
  </g>
</svg>

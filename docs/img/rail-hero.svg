<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="Turn rail on the conversation edge with a hover preview. Left or right, compact or loose. Under 900px the official UI hides and the rail stays. Cmd+F opens a 52px capsule into a result card.">
  <title>dsh-ui-outline</title>
  <desc>Edge turn rail, hover preview, narrow-column stay, and Cmd+F search.</desc>
  <style>
    text { font-family: system-ui, sans-serif; }
    .scene { fill: #edf0f3; }
    .col { fill: #fff; stroke: rgba(0,0,0,.1); stroke-width: 1; }
    .prompt { fill: rgba(15,17,21,.46); }
    .resp { fill: rgba(97,102,107,.24); }
    .dim { fill: rgba(97,102,107,.14); }
    .idle { fill: #81858c; }
    .on { fill: #0f1115; fill-opacity: .7; }
    .hot { fill: #0f1115; }
    .near { fill: #0f1115; fill-opacity: .55; }
    .stay { fill: #0f1115; fill-opacity: .82; }
    .ghost { fill: #81858c; fill-opacity: .55; }
    .ink { fill: #0f1115; }
    .mute { fill: #81858c; }
    .sub { fill: #61666b; }
    .card { fill: #fff; }
  </style>
  <defs>
    <filter id="lift" x="-35%" y="-40%" width="170%" height="190%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity=".16"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".08"/>
    </filter>
    <linearGradient id="rim" x1="0" y1="0" x2=".85" y2=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".42" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d6bfe" stop-opacity=".06"/>
      <stop offset="1" stop-color="#4d6bfe" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clipPrev"><rect x="186" y="106" width="190" height="106" rx="18.4"/></clipPath>
    <clipPath id="clipSearch"><rect x="588" y="108" width="268" height="192" rx="26"/></clipPath>
    <clipPath id="clipCap"><rect x="588" y="40" width="268" height="52" rx="26"/></clipPath>
  </defs>

  <rect class="scene" x="1" y="1" width="878" height="358" rx="16"/>

  <!-- labels -->
  <text class="ink" x="16" y="28" font-size="14" font-weight="600">Left · Loose</text>
  <text class="ink" x="146" y="28" font-size="14" font-weight="600">Right · Compact</text>
  <text class="ink" x="436" y="28" font-size="14" font-weight="600">&lt; 900px</text>
  <text class="ink" x="588" y="28" font-size="14" font-weight="600">Cmd+F</text>

  <!-- ===== 1a left edge, loose 30px pitch ===== -->
  <rect class="col" x="16" y="40" width="116" height="288" rx="12"/>
  <g>
    <rect class="prompt" x="46" y="62" width="72" height="8" rx="4"/>
    <rect class="resp" x="46" y="74" width="58" height="6" rx="3"/>
    <rect class="prompt" x="46" y="98" width="64" height="8" rx="4"/>
    <rect class="resp" x="46" y="110" width="70" height="6" rx="3"/>
    <rect class="dim" x="46" y="120" width="40" height="5" rx="2.5"/>
    <rect class="prompt" x="46" y="142" width="68" height="8" rx="4"/>
    <rect class="resp" x="46" y="154" width="50" height="6" rx="3"/>
    <rect class="prompt" x="46" y="176" width="74" height="8" rx="4"/>
    <rect class="resp" x="46" y="188" width="60" height="6" rx="3"/>
    <rect class="prompt" x="46" y="212" width="56" height="8" rx="4"/>
    <rect class="resp" x="46" y="224" width="66" height="6" rx="3"/>
    <rect class="dim" x="46" y="234" width="36" height="5" rx="2.5"/>
    <rect class="prompt" x="46" y="256" width="70" height="8" rx="4"/>
    <rect class="resp" x="46" y="268" width="48" height="6" rx="3"/>
    <rect class="prompt" x="46" y="292" width="60" height="8" rx="4"/>
    <rect class="resp" x="46" y="304" width="54" height="6" rx="3"/>
  </g>
  <!-- EDGE_GAP 12, left-aligned, rest 6px of the 20px mark, pitch 30 -->
  <g>
    <rect class="idle" x="28" y="77.8" width="6" height="2.5" rx="1.25"/>
    <rect class="idle" x="28" y="107.8" width="6" height="2.5" rx="1.25"/>
    <rect class="idle" x="28" y="137.8" width="6" height="2.5" rx="1.25"/>
    <rect class="idle" x="28" y="167.8" width="6" height="2.5" rx="1.25"/>
    <rect class="on" x="28" y="197.8" width="6" height="2.5" rx="1.25"/>
    <rect class="idle" x="28" y="227.8" width="6" height="2.5" rx="1.25"/>
    <rect class="idle" x="28" y="257.8" width="6" height="2.5" rx="1.25"/>
    <rect class="idle" x="28" y="287.8" width="6" height="2.5" rx="1.25"/>
  </g>

  <!-- ===== 1b right edge, compact 10px pitch, hover preview ===== -->
  <rect class="col" x="146" y="40" width="272" height="288" rx="12"/>
  <g>
    <rect class="prompt" x="162" y="54" width="168" height="8" rx="4"/>
    <rect class="resp" x="162" y="66" width="132" height="6" rx="3"/>
    <rect class="dim" x="162" y="76" width="96" height="5" rx="2.5"/>
    <rect class="prompt" x="162" y="90" width="120" height="8" rx="4"/>
    <rect class="resp" x="162" y="102" width="150" height="6" rx="3"/>
    <!-- transcript continues under the card -->
    <rect class="prompt" x="162" y="128" width="200" height="8" rx="4"/>
    <rect class="resp" x="162" y="140" width="176" height="6" rx="3"/>
    <rect class="dim" x="162" y="150" width="110" height="5" rx="2.5"/>
    <rect class="prompt" x="162" y="164" width="188" height="8" rx="4"/>
    <rect class="resp" x="162" y="176" width="150" height="6" rx="3"/>
    <rect class="prompt" x="162" y="190" width="164" height="8" rx="4"/>
    <rect class="resp" x="162" y="202" width="190" height="6" rx="3"/>
    <rect class="dim" x="162" y="212" width="100" height="5" rx="2.5"/>
    <rect class="prompt" x="162" y="236" width="156" height="8" rx="4"/>
    <rect class="resp" x="162" y="248" width="128" height="6" rx="3"/>
    <rect class="prompt" x="162" y="268" width="180" height="8" rx="4"/>
    <rect class="resp" x="162" y="280" width="140" height="6" rx="3"/>
    <rect class="dim" x="162" y="290" width="88" height="5" rx="2.5"/>
    <rect class="prompt" x="162" y="304" width="112" height="8" rx="4"/>
    <rect class="resp" x="162" y="316" width="96" height="6" rx="3"/>
  </g>

  <text class="sub" x="374" y="98" text-anchor="end" font-size="12" font-weight="600">Hover</text>

  <!-- preview: 106px, radius 18.4, 10px clear of the 20px hot mark -->
  <g filter="url(#lift)">
    <rect class="card" x="186" y="106" width="190" height="106" rx="18.4"/>
  </g>
  <g clip-path="url(#clipPrev)">
    <rect fill="url(#sheen)" x="186" y="106" width="190" height="40"/>
  </g>
  <rect x="186.5" y="106.5" width="189" height="105" rx="18" fill="none" stroke="rgba(0,0,0,.1)" stroke-width="1"/>
  <rect x="186.5" y="106.5" width="189" height="105" rx="18" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
  <g>
    <rect class="ink" x="198" y="132" width="132" height="8" rx="4"/>
    <rect class="ink" x="198" y="146" width="96" height="8" rx="4"/>
    <rect class="sub" x="198" y="166" width="150" height="6" rx="3" opacity=".75"/>
    <rect class="sub" x="198" y="178" width="112" height="6" rx="3" opacity=".45"/>
  </g>

  <!-- compact ladder, right-aligned, pitch 10, rest 6 / hot 20. Ends fade: the frame scrolls. -->
  <g>
    <rect class="idle" x="400" y="77.8" width="6" height="2.5" rx="1.25" opacity=".4"/>
    <rect class="idle" x="400" y="87.8" width="6" height="2.5" rx="1.25" opacity=".7"/>
    <rect class="idle" x="400" y="97.8" width="6" height="2.5" rx="1.25"/>
    <rect class="idle" x="400" y="107.8" width="6" height="2.5" rx="1.25"/>
    <rect class="idle" x="400" y="117.8" width="6" height="2.5" rx="1.25"/>
    <rect class="idle" x="398" y="127.8" width="8" height="2.5" rx="1.25"/>
    <rect class="near" x="394" y="137.8" width="12" height="2.5" rx="1.25"/>
    <rect class="near" x="390" y="147.8" width="16" height="2.5" rx="1.25"/>
    <rect class="hot" x="386" y="157.8" width="20" height="2.5" rx="1.25"/>
    <rect class="near" x="390" y="167.8" width="16" height="2.5" rx="1.25"/>
    <rect class="near" x="394" y="177.8" width="12" height="2.5" rx="1.25"/>
    <rect class="idle" x="398" y="187.8" width="8" height="2.5" rx="1.25"/>
    <rect class="idle" x="400" y="197.8" width="6" height="2.5" rx="1.25"/>
    <rect class="idle" x="400" y="207.8" width="6" height="2.5" rx="1.25"/>
    <rect class="idle" x="400" y="217.8" width="6" height="2.5" rx="1.25"/>
    <rect class="on" x="400" y="227.8" width="6" height="2.5" rx="1.25"/>
    <rect class="idle" x="400" y="237.8" width="6" height="2.5" rx="1.25"/>
    <rect class="idle" x="400" y="247.8" width="6" height="2.5" rx="1.25"/>
    <rect class="idle" x="400" y="257.8" width="6" height="2.5" rx="1.25"/>
    <rect class="idle" x="400" y="267.8" width="6" height="2.5" rx="1.25"/>
    <rect class="idle" x="400" y="277.8" width="6" height="2.5" rx="1.25" opacity=".7"/>
    <rect class="idle" x="400" y="287.8" width="6" height="2.5" rx="1.25" opacity=".4"/>
  </g>
  <!-- pointer on the hot mark -->
  <path d="M410 159 l11 4.2-4.6 1.1 3.1 5.6-2.1 1.15-3.1-5.6-3.9 2.3z" fill="#0f1115" stroke="#fff" stroke-width="1.15" stroke-linejoin="round" paint-order="stroke"/>

  <!-- ===== 2 narrow column: official UI hides, rail stays ===== -->
  <rect class="col" x="436" y="40" width="132" height="288" rx="12"/>
  <text class="mute" x="448" y="78" font-size="12" font-weight="500">Official hides</text>
  <!-- cancelled official ticks -->
  <g>
    <rect class="ghost" x="542" y="57.8" width="14" height="2.5" rx="1.25"/>
    <rect class="ghost" x="542" y="67.8" width="14" height="2.5" rx="1.25"/>
    <rect class="ghost" x="542" y="77.8" width="14" height="2.5" rx="1.25"/>
    <rect class="ghost" x="542" y="87.8" width="14" height="2.5" rx="1.25"/>
    <rect class="ghost" x="542" y="97.8" width="14" height="2.5" rx="1.25"/>
  </g>
  <g stroke="#0f1115" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".7">
    <line x1="536" y1="50" x2="562" y2="108"/>
    <line x1="562" y1="50" x2="536" y2="108"/>
  </g>
  <g>
    <rect class="prompt" x="448" y="132" width="78" height="8" rx="4"/>
    <rect class="resp" x="448" y="144" width="62" height="6" rx="3"/>
    <rect class="prompt" x="448" y="164" width="70" height="8" rx="4"/>
    <rect class="resp" x="448" y="176" width="54" height="6" rx="3"/>
    <rect class="prompt" x="448" y="214" width="74" height="8" rx="4"/>
    <rect class="resp" x="448" y="226" width="58" height="6" rx="3"/>
    <rect class="prompt" x="448" y="238" width="66" height="8" rx="4"/>
    <rect class="resp" x="448" y="250" width="48" height="6" rx="3"/>
    <rect class="prompt" x="448" y="270" width="72" height="8" rx="4"/>
    <rect class="resp" x="448" y="282" width="50" height="6" rx="3"/>
  </g>
  <!-- our rail, same edge, still there -->
  <g>
    <rect class="stay" x="550" y="123.8" width="6" height="2.5" rx="1.25"/>
    <rect class="stay" x="550" y="133.8" width="6" height="2.5" rx="1.25"/>
    <rect class="stay" x="550" y="143.8" width="6" height="2.5" rx="1.25"/>
    <rect class="stay" x="550" y="153.8" width="6" height="2.5" rx="1.25"/>
    <rect class="hot" x="540" y="163.8" width="16" height="2.5" rx="1.25"/>
    <rect class="stay" x="550" y="173.8" width="6" height="2.5" rx="1.25"/>
    <rect class="stay" x="550" y="183.8" width="6" height="2.5" rx="1.25"/>
    <rect class="stay" x="550" y="193.8" width="6" height="2.5" rx="1.25"/>
    <rect class="stay" x="550" y="203.8" width="6" height="2.5" rx="1.25"/>
    <rect class="stay" x="550" y="213.8" width="6" height="2.5" rx="1.25"/>
    <rect class="stay" x="550" y="223.8" width="6" height="2.5" rx="1.25"/>
    <rect class="stay" x="550" y="233.8" width="6" height="2.5" rx="1.25"/>
    <rect class="stay" x="550" y="243.8" width="6" height="2.5" rx="1.25"/>
    <rect class="stay" x="550" y="253.8" width="6" height="2.5" rx="1.25"/>
    <rect class="stay" x="550" y="263.8" width="6" height="2.5" rx="1.25"/>
    <rect class="stay" x="550" y="273.8" width="6" height="2.5" rx="1.25"/>
    <rect class="stay" x="550" y="283.8" width="6" height="2.5" rx="1.25"/>
  </g>
  <text class="ink" x="532" y="198" text-anchor="end" font-size="13" font-weight="600">Rail stays</text>

  <!-- ===== 3 Cmd+F: 52px stadium capsule, then the opened card ===== -->
  <g filter="url(#lift)">
    <rect class="card" x="588" y="40" width="268" height="52" rx="26"/>
  </g>
  <g clip-path="url(#clipCap)">
    <rect fill="url(#sheen)" x="588" y="40" width="268" height="26"/>
  </g>
  <rect x="588.5" y="40.5" width="267" height="51" rx="25.5" fill="none" stroke="rgba(0,0,0,.1)"/>
  <rect x="588.5" y="40.5" width="267" height="51" rx="25.5" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
  <!-- magnifier, left; empty placeholder centered -->
  <g fill="none" stroke="#81858c" stroke-width="1.7" stroke-linecap="round">
    <circle cx="610" cy="66" r="5.4"/>
    <path d="M614.2 70.2 L617.6 73.6"/>
  </g>
  <text class="mute" x="722" y="66" text-anchor="middle" dominant-baseline="middle" font-size="15">Search</text>

  <g filter="url(#lift)">
    <rect class="card" x="588" y="108" width="268" height="192" rx="26"/>
  </g>
  <g clip-path="url(#clipSearch)">
    <rect fill="url(#sheen)" x="588" y="108" width="268" height="36"/>
  </g>
  <rect x="588.5" y="108.5" width="267" height="191" rx="18" fill="none" stroke="rgba(0,0,0,.1)"/>
  <rect x="588.5" y="108.5" width="267" height="191" rx="18" fill="none" stroke="url(#rim)" stroke-width="1.6"/>

  <!-- input row is the same 52px -->
  <g fill="none" stroke="#81858c" stroke-width="1.7" stroke-linecap="round">
    <circle cx="610" cy="134" r="5.4"/>
    <path d="M614.2 138.2 L617.6 141.6"/>
  </g>
  <text class="ink" x="628" y="134" dominant-baseline="middle" font-size="15">edge</text>
  <rect fill="#4d6bfe" x="666" y="126" width="1.6" height="16" rx=".8"/>

  <line x1="588" y1="160.5" x2="856" y2="160.5" stroke="rgba(0,0,0,.1)"/>

  <!-- selected row: inset pill, radius 8, height 48, brand 10% -->
  <rect x="596" y="167" width="252" height="48" rx="8" fill="rgba(77,107,254,.1)"/>
  <rect x="608" y="182" width="22" height="18" rx="6" fill="rgba(0,0,0,.05)"/>
  <text class="sub" x="619" y="191" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="500">3</text>
  <rect class="ink" x="638" y="178" width="40" height="8" rx="4"/>
  <rect x="682" y="174" width="34" height="16" rx="3" fill="rgba(77,107,254,.24)"/>
  <rect class="ink" x="686" y="178" width="26" height="8" rx="3"/>
  <rect class="ink" x="720" y="178" width="56" height="8" rx="4"/>
  <rect class="sub" x="638" y="196" width="112" height="6" rx="3" opacity=".7"/>

  <!-- second row, no pill — the highlight is the selected one -->
  <rect x="608" y="230" width="22" height="18" rx="6" fill="rgba(0,0,0,.05)"/>
  <text class="sub" x="619" y="239" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="500">8</text>
  <rect class="sub" x="638" y="226" width="96" height="8" rx="4" opacity=".8"/>
  <rect class="sub" x="638" y="242" width="72" height="6" rx="3" opacity=".45"/>

  <line x1="588" y1="269.5" x2="856" y2="269.5" stroke="rgba(0,0,0,.1)"/>
  <text class="mute" x="604" y="288" font-size="12">select · jump · esc</text>
</svg>

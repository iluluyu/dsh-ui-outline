<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 232" width="760" height="232" role="img" aria-label="Preview card materials: none (opaque official token), frost (veil + blur), liquid (veil + edge lens: neutral corner glint, Fresnel rim, thick-lens fold)">
  <!-- Real parameters from lib/client.js (standard preset, 1:2 scale):
       frost  = 20% layer-1 veil + blur(6px) saturate(1.5);
       liquid = 35% veil + blur(6px) saturate(1.6) contrast(1.02)
               + radial glint 100x50 @ (26,14) white .16/.04/0
               + linear sheen 132deg white .10 -> cool #78AAFF .04
               + Fresnel rim on the border: .30 -> .06@22% -> 0@45%
               + SDF displacement lens at the edge (feDisplacementMap,
                 Chromium) whose fold is drawn for real here: the left band
                 carries the backdrop bars squeezed, content bending into
                 the glass. Light enters from the conversation-facing
                 top-left corner (a right rail); it mirrors with side. -->
  <style>
    .scene { fill: #f7f8fa; stroke: rgba(0, 0, 0, .06); }
    .ink   { fill: #0f1115; }
    .sub   { fill: rgba(15, 17, 21, .58); }
    .surface { fill: #ffffff; stroke: rgba(0, 0, 0, .07); }
    .prompt { fill: rgba(97, 102, 107, .30); }
    .resp   { fill: rgba(97, 102, 107, .22); }
    .respDim{ fill: rgba(97, 102, 107, .13); }
    .none   { fill: #ffffff; }
    .frost  { fill: rgba(255, 255, 255, .20); }
    .liquid { fill: rgba(255, 255, 255, .35); }
    .ring   { stroke: rgba(0, 0, 0, .10); fill: none; }
    .lbl  { font-size: 13px; font-weight: 600; fill: #0f1115; }
    .lbl2 { font-size: 13px; font-weight: 600; fill: #61666b; }
    .cap  { font-size: 11.5px; fill: #61666b; }
    .fxF { filter: url(#fxFrost); }
    .fxL { filter: url(#fxLiquid); }
    .liq { fill: url(#mGlint); } .sheen { fill: url(#mSheen); } .rim { stroke: url(#mRim); }
    .fold { fill: url(#mFold); }
    .foldBar { fill: rgba(97,102,107,.85); } .foldBar2 { fill: rgba(97,102,107,.5); }
    @media (prefers-color-scheme: dark) {
      .scene { fill: #17181a; stroke: rgba(255, 255, 255, .07); }
      .ink   { fill: #f9fafb; }
      .sub   { fill: rgba(249, 250, 251, .60); }
      .surface { fill: #1d1e20; stroke: rgba(255, 255, 255, .08); }
      .prompt { fill: rgba(166, 171, 178, .30); }
      .resp   { fill: rgba(166, 171, 178, .22); }
      .respDim{ fill: rgba(166, 171, 178, .13); }
      .none   { fill: #232324; }
      .frost  { fill: rgba(35, 35, 36, .20); }
      .liquid { fill: rgba(35, 35, 36, .35); }
      .ring   { stroke: rgba(255, 255, 255, .14); fill: none; }
      .lbl  { font-size: 13px; font-weight: 600; fill: #f9fafb; }
      .lbl2 { font-size: 13px; font-weight: 600; fill: #a6abb2; }
      .cap  { font-size: 11.5px; fill: #b8bdc3; }
      .fxF { filter: url(#fxFrostD); }
      .fxL { filter: url(#fxLiquidD); }
      .liq { fill: url(#mGlintD); } .sheen { fill: url(#mSheenD); } .rim { stroke: url(#mRimD); }
      .fold { fill: url(#mFoldD); }
      .foldBar { fill: rgba(166,171,178,.85); } .foldBar2 { fill: rgba(166,171,178,.5); }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  </style>

  <defs>
    <path id="cardShape" d="M26.0 0.0 L133.4 0.1 L137.2 0.4 L140.1 1.0 L142.4 1.8 L144.3 2.8 L145.9 4.1 L147.2 5.7 L148.2 7.6 L149.0 9.9 L149.6 12.8 L149.9 16.6 L150.0 26.0 L149.9 49.4 L149.6 53.2 L149.0 56.1 L148.2 58.4 L147.2 60.3 L145.9 61.9 L144.3 63.2 L142.4 64.2 L140.1 65.0 L137.2 65.6 L133.4 65.9 L124.0 66.0 L16.6 65.9 L12.8 65.6 L9.9 65.0 L7.6 64.2 L5.7 63.2 L4.1 61.9 L2.8 60.3 L1.8 58.4 L1.0 56.1 L0.4 53.2 L0.1 49.4 L0.0 40.0 L0.1 16.6 L0.4 12.8 L1.0 9.9 L1.8 7.6 L2.8 5.7 L4.1 4.1 L5.7 2.8 L7.6 1.8 L9.9 1.0 L12.8 0.4 L16.6 0.1 L26.0 0.0Z"/>
    <!-- neutral corner glint: 100x50 @ (26,14) scaled 1:2, entering from the
         conversation-facing top-left corner -->
    <radialGradient id="mGlint" gradientUnits="userSpaceOnUse" cx="553" cy="95" r="33" gradientTransform="scale(1,0.5)">
      <stop offset="0%"  stop-color="rgba(255,255,255,.38)"/>
      <stop offset="45%" stop-color="rgba(255,255,255,.10)"/>
      <stop offset="70%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <radialGradient id="mGlintD" gradientUnits="userSpaceOnUse" cx="553" cy="95" r="33" gradientTransform="scale(1,0.5)">
      <stop offset="0%"  stop-color="rgba(255,255,255,.20)"/>
      <stop offset="45%" stop-color="rgba(255,255,255,.06)"/>
      <stop offset="70%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <!-- linear sheen 132deg: white .10 falling off to a faint cool wash -->
    <linearGradient id="mSheen" gradientUnits="objectBoundingBox" x1="0" y1="0" x2=".74" y2=".67">
      <stop offset="0%"  stop-color="rgba(255,255,255,.10)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(120,170,255,.05)"/>
    </linearGradient>
    <linearGradient id="mSheenD" gradientUnits="objectBoundingBox" x1="0" y1="0" x2=".74" y2=".67">
      <stop offset="0%"  stop-color="rgba(249,250,251,.08)"/>
      <stop offset="50%" stop-color="rgba(249,250,251,0)"/>
      <stop offset="100%" stop-color="rgba(120,170,255,.05)"/>
    </linearGradient>
    <!-- Fresnel rim on the border: .30 peak -> .06 @22% -> 0 @45%, one-way
         (no far-corner bounce) -->
    <linearGradient id="mRim" gradientUnits="objectBoundingBox" x1="0" y1="0" x2=".74" y2=".67">
      <stop offset="0%"  stop-color="rgba(255,255,255,1)"/>
      <stop offset="22%" stop-color="rgba(255,255,255,.30)"/>
      <stop offset="45%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <linearGradient id="mRimD" gradientUnits="objectBoundingBox" x1="0" y1="0" x2=".74" y2=".67">
      <stop offset="0%"  stop-color="rgba(249,250,251,.7)"/>
      <stop offset="22%" stop-color="rgba(249,250,251,.16)"/>
      <stop offset="45%" stop-color="rgba(249,250,251,0)"/>
    </linearGradient>
    <filter id="fxFrost"><feGaussianBlur stdDeviation="3"/><feColorMatrix type="saturate" values="1.5"/></filter>
    <filter id="fxFrostD"><feGaussianBlur stdDeviation="3"/><feColorMatrix type="saturate" values="1.4"/></filter>
    <filter id="fxLiquid"><feGaussianBlur stdDeviation="3"/><feColorMatrix type="saturate" values="1.6"/><feComponentTransfer><feFuncR type="linear" slope="1.02"/><feFuncG type="linear" slope="1.02"/><feFuncB type="linear" slope="1.03"/></feComponentTransfer></filter>
    <filter id="fxLiquidD"><feGaussianBlur stdDeviation="3"/><feColorMatrix type="saturate" values="1.6"/><feComponentTransfer><feFuncR type="linear" slope="1.03"/><feFuncG type="linear" slope="1.03"/><feFuncB type="linear" slope="1.04"/></feComponentTransfer></filter>
    <filter id="fxShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,.12)" flood-opacity="1"/>
    </filter>
    <linearGradient id="mFold" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="rgba(255,255,255,.34)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <linearGradient id="mFoldD" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="rgba(249,250,251,.10)"/>
      <stop offset="100%" stop-color="rgba(249,250,251,0)"/>
    </linearGradient>
    <clipPath id="clipF"><use href="#cardShape" transform="translate(305,88)"/></clipPath>
    <clipPath id="clipL"><use href="#cardShape" transform="translate(540,88)"/></clipPath>
  </defs>

  <rect class="scene" x="1" y="1" width="758" height="230" rx="14"/>

  <!-- ── none · 无 ────────────────────────────────────────────────── -->
  <text x="60" y="40" class="lbl"><tspan class="lbl2">none</tspan><tspan class="lbl"> · 无</tspan></text>
  <rect class="surface" x="40" y="56" width="210" height="130" rx="12"/>
  <g>
    <rect class="prompt" x="60" y="70"  width="120" height="8" rx="4"/>
    <rect class="resp"    x="60" y="92"  width="168" height="6" rx="3"/>
    <rect class="respDim" x="60" y="124" width="128" height="6" rx="3"/>
    <rect class="prompt" x="60" y="150" width="96"  height="8" rx="4"/>
    <rect class="resp"    x="60" y="178" width="150" height="6" rx="3"/>
  </g>
  <g filter="url(#fxShadow)">
    <use href="#cardShape" transform="translate(70,88)" class="none"/>
    <use href="#cardShape" transform="translate(70,88)" fill="none" class="ring" stroke-width="1"/>
    <rect class="ink" x="86" y="102" width="98" height="7" rx="3.5"/>
    <rect class="ink" x="86" y="114" width="70" height="7" rx="3.5"/>
    <rect class="sub" x="86" y="130" width="112" height="6" rx="3"/>
  </g>
  <text x="70" y="204" class="cap">不透明 · opaque tokens</text>

  <!-- ── frost · 毛玻璃 ───────────────────────────────────────────── -->
  <text x="300" y="40" class="lbl"><tspan class="lbl2">frost</tspan><tspan class="lbl"> · 毛玻璃</tspan></text>
  <rect class="surface" x="275" y="56" width="210" height="130" rx="12"/>
  <g>
    <rect class="prompt" x="295" y="70"  width="120" height="8" rx="4"/>
    <rect class="resp"    x="295" y="92"  width="168" height="6" rx="3"/>
    <rect class="respDim" x="295" y="124" width="128" height="6" rx="3"/>
    <rect class="prompt" x="295" y="150" width="96"  height="8" rx="4"/>
    <rect class="resp"    x="295" y="178" width="150" height="6" rx="3"/>
  </g>
  <g class="fxF" clip-path="url(#clipF)">
    <rect class="prompt" x="295" y="70"  width="120" height="8" rx="4"/>
    <rect class="resp"    x="295" y="92"  width="168" height="6" rx="3"/>
    <rect class="respDim" x="295" y="124" width="128" height="6" rx="3"/>
    <rect class="prompt" x="295" y="150" width="96"  height="8" rx="4"/>
    <rect class="resp"    x="295" y="178" width="150" height="6" rx="3"/>
  </g>
  <g filter="url(#fxShadow)">
    <use href="#cardShape" transform="translate(305,88)" class="frost"/>
    <use href="#cardShape" transform="translate(305,88)" fill="none" class="ring" stroke-width="1"/>
    <rect class="ink" x="321" y="102" width="98" height="7" rx="3.5"/>
    <rect class="ink" x="321" y="114" width="70" height="7" rx="3.5"/>
    <rect class="sub" x="321" y="130" width="112" height="6" rx="3"/>
  </g>
  <text x="305" y="204" class="cap">面纱 + 模糊 · veil + blur</text>

  <!-- ── liquid · 液态玻璃 ────────────────────────────────────────── -->
  <text x="540" y="40" class="lbl"><tspan class="lbl2">liquid</tspan><tspan class="lbl"> · 液态玻璃</tspan></text>
  <rect class="surface" x="510" y="56" width="210" height="130" rx="12"/>
  <g>
    <rect class="prompt" x="530" y="70"  width="120" height="8" rx="4"/>
    <rect class="resp"    x="530" y="92"  width="168" height="6" rx="3"/>
    <rect class="respDim" x="530" y="124" width="128" height="6" rx="3"/>
    <rect class="prompt" x="530" y="150" width="96"  height="8" rx="4"/>
    <rect class="resp"    x="530" y="178" width="150" height="6" rx="3"/>
  </g>
  <!-- blurred, saturated backdrop under the veil -->
  <g class="fxL" clip-path="url(#clipL)">
    <rect class="prompt" x="530" y="70"  width="120" height="8" rx="4"/>
    <rect class="resp"    x="530" y="92"  width="168" height="6" rx="3"/>
    <rect class="respDim" x="530" y="124" width="128" height="6" rx="3"/>
    <rect class="prompt" x="530" y="150" width="96"  height="8" rx="4"/>
    <rect class="resp"    x="530" y="178" width="150" height="6" rx="3"/>
  </g>
  <g filter="url(#fxShadow)">
    <use href="#cardShape" transform="translate(540,88)" class="liquid"/>
    <g clip-path="url(#clipL)">
      <!-- thick-lens fold: the left band carries the backdrop bars
           squeezed vertically, bending into the glass -->
      <rect class="fold" x="540" y="88" width="14" height="66"/>
      <rect class="foldBar"  x="540.5" y="92"  width="13" height="2.6" rx="1.3"/>
      <rect class="foldBar2" x="540.5" y="95.4" width="12" height="1.8" rx=".9"/>
      <rect class="foldBar"  x="540.5" y="124" width="13" height="2.6" rx="1.3"/>
      <rect class="foldBar2" x="540.5" y="127.4" width="12" height="1.8" rx=".9"/>
      <rect class="foldBar"  x="540.5" y="150" width="13" height="2.6" rx="1.3"/>
      <rect class="foldBar2" x="540.5" y="153.4" width="12" height="1.8" rx=".9"/>
      <rect class="liq"   x="540" y="88" width="150" height="66"/>
      <rect class="sheen" x="540" y="88" width="150" height="66"/>
    </g>
    <use href="#cardShape" transform="translate(540,88)" fill="none" class="ring" stroke-width="1"/>
    <!-- Fresnel rim: light catching the border, brightest at the lit corner -->
    <use href="#cardShape" transform="translate(540,88)" fill="none" class="rim" stroke-width="1.5"/>
    <rect class="ink" x="556" y="102" width="98" height="7" rx="3.5"/>
    <rect class="ink" x="556" y="114" width="70" height="7" rx="3.5"/>
    <rect class="sub" x="556" y="130" width="112" height="6" rx="3"/>
  </g>
  <text x="540" y="204" class="cap">+ 边缘透镜 · 边缘光 · edge lens &amp; rim</text>
</svg>

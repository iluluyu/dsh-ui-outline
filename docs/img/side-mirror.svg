<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="The rail mirrors with the side setting: mark anchor, card opening, and glass light flip together">
  <!-- Side mirroring: one scene per side setting, mirrored composition.
       side=right: marks hug the right gutter edge, card opens left, glass light
       enters from the conversation-facing top-left corner.
       side=left:  marks hug the left gutter edge, card opens right, light from
       the top-right corner. The wave pulse runs in sync on both sides. -->
  <style>
    .scene { fill: #f7f8fa; stroke: rgba(0, 0, 0, .06); }
    .ink   { fill: #0f1115; }
    .sub   { fill: rgba(15, 17, 21, .58); }
    .surface { fill: #ffffff; stroke: rgba(0, 0, 0, .07); }
    .card    { fill: rgba(255, 255, 255, .72); }
    .cardRing { stroke: rgba(0, 0, 0, .10); fill: none; }
    .markIdle { fill: rgba(129, 133, 140, .40); }
    .markHot  { fill: #0f1115; }
    .axis   { stroke: rgba(97, 102, 107, .5); stroke-dasharray: 3 4; fill: none; }
    .cap    { font-size: 12.5px; fill: #61666b; }
    .capInk { font-size: 13px; font-weight: 600; fill: #0f1115; }
    @media (prefers-color-scheme: dark) {
      .scene { fill: #17181a; stroke: rgba(255, 255, 255, .07); }
      .ink   { fill: #f9fafb; }
      .sub   { fill: rgba(249, 250, 251, .60); }
      .surface { fill: #1d1e20; stroke: rgba(255, 255, 255, .08); }
      .card    { fill: rgba(35, 35, 36, .78); }
      .cardRing { stroke: rgba(255, 255, 255, .14); fill: none; }
      .markIdle { fill: rgba(173, 178, 184, .40); }
      .markHot  { fill: #f9fafb; }
      .axis   { stroke: rgba(166, 171, 178, .5); stroke-dasharray: 3 4; fill: none; }
      .cap    { font-size: 12.5px; fill: #a6abb2; }
      .capInk { font-size: 13px; font-weight: 600; fill: #f9fafb; }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  </style>

  <defs>
    <!-- conversation-facing corner light: top-left for side=right -->
    <radialGradient id="lightR" cx="16%" cy="12%" r="80%">
      <stop offset="0%" stop-color="rgba(255,255,255,.5)"/>
      <stop offset="55%" stop-color="rgba(255,255,255,.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <radialGradient id="lightRD" cx="16%" cy="12%" r="80%">
      <stop offset="0%" stop-color="rgba(249,250,251,.14)"/>
      <stop offset="55%" stop-color="rgba(249,250,251,.05)"/>
      <stop offset="100%" stop-color="rgba(249,250,251,0)"/>
    </radialGradient>
    <!-- mirrored: top-right for side=left -->
    <radialGradient id="lightL" cx="84%" cy="12%" r="80%">
      <stop offset="0%" stop-color="rgba(255,255,255,.5)"/>
      <stop offset="55%" stop-color="rgba(255,255,255,.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <radialGradient id="lightLD" cx="84%" cy="12%" r="80%">
      <stop offset="0%" stop-color="rgba(249,250,251,.14)"/>
      <stop offset="55%" stop-color="rgba(249,250,251,.05)"/>
      <stop offset="100%" stop-color="rgba(249,250,251,0)"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="rgba(0,0,0,.14)" flood-opacity="1"/>
    </filter>
    <style>
      .lightR { fill: url(#lightR); }
      .lightL { fill: url(#lightL); }
      @media (prefers-color-scheme: dark) {
        .lightR { fill: url(#lightRD); }
        .lightL { fill: url(#lightLD); }
      }
    </style>
  </defs>

  <rect class="scene" x="1" y="1" width="758" height="248" rx="14"/>

  <!-- mirror axis -->
  <line class="axis" x1="380" y1="48" x2="380" y2="222"/>
  <text x="380" y="36" text-anchor="middle" class="cap">⇄ mirror · 镜像</text>

  <!-- ── scene A: side=right ─────────────────────────────────────── -->
  <text x="60" y="40" class="capInk">side · right</text>
  <rect class="surface" x="40" y="56" width="300" height="150" rx="12"/>

  <!-- marks hug the right gutter edge (right edge x=328) -->
  <rect class="markIdle" x="322" y="76"  width="6"  height="2" rx="1"/>
  <rect class="markIdle" x="314" y="106" width="14" height="2" rx="1"/>
  <rect class="markHot"  x="308" y="136" width="20" height="2" rx="1">
  </rect>
  <rect class="markIdle" x="314" y="166" width="14" height="2" rx="1"/>
  <rect class="markIdle" x="322" y="196" width="6"  height="2" rx="1"/>

  <!-- card opens left; light from top-left -->
  <g filter="url(#cardShadow)">
    <rect class="card" x="178" y="104" width="120" height="66" rx="14"/>
    <rect class="lightR" x="178" y="104" width="120" height="66" rx="14"/>
    <rect class="cardRing" x="178.5" y="104.5" width="119" height="65" rx="13.5" stroke-width="1"/>
    <rect class="ink" x="192" y="118" width="78" height="7" rx="3.5"/>
    <rect class="ink" x="192" y="130" width="56" height="7" rx="3.5"/>
    <rect class="sub" x="192" y="146" width="88" height="6" rx="3"/>
  </g>

  <!-- ── scene B: side=left (mirror) ─────────────────────────────── -->
  <text x="700" y="40" text-anchor="end" class="capInk">side · left</text>
  <rect class="surface" x="420" y="56" width="300" height="150" rx="12"/>

  <!-- marks hug the left gutter edge (left edge x=432) -->
  <rect class="markIdle" x="432" y="76"  width="6"  height="2" rx="1"/>
  <rect class="markIdle" x="432" y="106" width="14" height="2" rx="1"/>
  <rect class="markHot"  x="432" y="136" width="20" height="2" rx="1">
  </rect>
  <rect class="markIdle" x="432" y="166" width="14" height="2" rx="1"/>
  <rect class="markIdle" x="432" y="196" width="6"  height="2" rx="1"/>

  <!-- card opens right; light from top-right -->
  <g filter="url(#cardShadow)">
    <rect class="card" x="462" y="104" width="120" height="66" rx="14"/>
    <rect class="lightL" x="462" y="104" width="120" height="66" rx="14"/>
    <rect class="cardRing" x="462.5" y="104.5" width="119" height="65" rx="13.5" stroke-width="1"/>
    <rect class="ink" x="476" y="118" width="78" height="7" rx="3.5"/>
    <rect class="ink" x="476" y="130" width="56" height="7" rx="3.5"/>
    <rect class="sub" x="476" y="146" width="88" height="6" rx="3"/>
  </g>
</svg>

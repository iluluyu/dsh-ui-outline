<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 226" width="760" height="226" role="img" aria-label="One mark language, two densities: compact 14px pitch and loose 30px pitch">
  <!-- Two panels in the same state (resting marks, current turn color-only) so the
       only difference is density. The hit strip below stays animated. -->
  <style>
    .scene { fill: #f7f8fa; stroke: rgba(0, 0, 0, .06); }
    .ink   { fill: #0f1115; }
    .ink2  { fill: #61666b; }
    .surface { fill: #ffffff; stroke: rgba(0, 0, 0, .07); }
    .edge    { fill: rgba(0, 0, 0, .05); }
    .strip   { fill: rgba(15, 17, 21, .04); }
    .markIdle { fill: rgba(129, 133, 140, .40); }
    .markOn   { fill: rgba(15, 17, 21, .62); }
    .cursor   { fill: none; stroke: #61666b; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .scene { fill: #17181a; stroke: rgba(255, 255, 255, .07); }
      .ink   { fill: #f9fafb; }
      .ink2  { fill: #a6abb2; }
      .surface { fill: #1d1e20; stroke: rgba(255, 255, 255, .08); }
      .edge    { fill: rgba(255, 255, 255, .07); }
      .strip   { fill: rgba(249, 250, 251, .05); }
      .markIdle { fill: rgba(173, 178, 184, .40); }
      .markOn   { fill: rgba(249, 250, 251, .62); }
      .cursor   { fill: none; stroke: #a6abb2; stroke-width: 1.5; }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lbl { font-size: 13px; font-weight: 600; }
  </style>

    <rect class="scene-placeholder" x="0" y="0" width="0" height="0"/>
  <defs>
    <clipPath id="clipA"><rect x="52" y="62" width="300" height="150" rx="12"/></clipPath>
    <clipPath id="clipB"><rect x="428" y="62" width="280" height="150" rx="12"/></clipPath>
    <style>
      .guide { stroke: rgba(97, 102, 107, .55); stroke-dasharray: 2 3; fill: none; }
      .gtext { font-size: 11px; fill: #61666b; }
      @media (prefers-color-scheme: dark) {
        .guide { stroke: rgba(166, 171, 178, .55); }
        .gtext { fill: #a6abb2; }
      }
    </style>
  </defs>

  <rect class="scene" x="1" y="1" width="758" height="224" rx="14"/>

  <!-- ── panel A: compact · 14px ──────────────────────────────────── -->
  <text x="52" y="46" class="lbl"><tspan class="ink">compact</tspan><tspan class="ink2"> · 14px</tspan></text>

  <g clip-path="url(#clipA)">
    <rect class="surface" x="52" y="62" width="300" height="150" rx="12"/>
    <rect class="edge" x="300" y="62" width="52" height="150"/>
  </g>
  <!-- 10 resting marks, 14px pitch, right-aligned at the gutter edge (x=346);
       current turn is the last, color-only -->
  <g>
    <rect class="markIdle" x="340" y="74"  width="6" height="2" rx="1"/>
    <rect class="markIdle" x="340" y="88"  width="6" height="2" rx="1"/>
    <rect class="markIdle" x="340" y="102" width="6" height="2" rx="1"/>
    <rect class="markIdle" x="340" y="116" width="6" height="2" rx="1"/>
    <rect class="markIdle" x="340" y="130" width="6" height="2" rx="1"/>
    <rect class="markIdle" x="340" y="144" width="6" height="2" rx="1"/>
    <rect class="markIdle" x="340" y="158" width="6" height="2" rx="1"/>
    <rect class="markIdle" x="340" y="172" width="6" height="2" rx="1"/>
    <rect class="markIdle" x="340" y="186" width="6" height="2" rx="1"/>
    <rect class="markOn"   x="340" y="200" width="6" height="2" rx="1"/>
  </g>
  <line class="guide" x1="331" y1="75" x2="331" y2="87"/>
  <line class="guide" x1="328" y1="75" x2="334" y2="75"/>
  <line class="guide" x1="328" y1="87" x2="334" y2="87"/>
  <text x="325" y="81" class="gtext" text-anchor="middle" transform="rotate(-90 325 81)">14px</text>

  <!-- ── panel B: loose · 30px ────────────────────────────────────── -->
  <text x="428" y="46" class="lbl"><tspan class="ink">loose</tspan><tspan class="ink2"> · 30px</tspan></text>

  <g clip-path="url(#clipB)">
    <rect class="surface" x="428" y="62" width="280" height="150" rx="12"/>
    <rect class="edge" x="652" y="62" width="56" height="150"/>
  </g>
  <!-- 5 resting marks, 30px pitch, same rest length and same color-only current -->
  <g>
    <rect class="markIdle" x="696" y="74"  width="6" height="2" rx="1"/>
    <rect class="markIdle" x="696" y="104" width="6" height="2" rx="1"/>
    <rect class="markIdle" x="696" y="134" width="6" height="2" rx="1"/>
    <rect class="markIdle" x="696" y="164" width="6" height="2" rx="1"/>
    <rect class="markOn"   x="696" y="194" width="6" height="2" rx="1"/>
  </g>
  <line class="guide" x1="687" y1="75" x2="687" y2="103"/>
  <line class="guide" x1="684" y1="75" x2="690" y2="75"/>
  <line class="guide" x1="684" y1="103" x2="690" y2="103"/>
  <text x="681" y="89" class="gtext" text-anchor="middle" transform="rotate(-90 681 89)">30px</text>

</svg>

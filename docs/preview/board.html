<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dsh-ui-outline · board</title>
<style>
	:root { --line: rgba(16, 20, 30, .07); --muted: #8a9099; }
	* { box-sizing: border-box; }
	html, body { margin: 0; padding: 0; }
	body {
		width: 880px;
		height: 635px;
		overflow: hidden;
		background:
			radial-gradient(620px 420px at 84% -6%, rgba(77, 107, 254, .12), transparent 62%),
			radial-gradient(520px 380px at -6% 104%, rgba(168, 85, 247, .08), transparent 60%),
			#eff1f4;
		font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
		-webkit-font-smoothing: antialiased;
	}
	.board {
		display: grid;
		grid-template-columns: 560px 310px;
		grid-template-rows: 375px 250px;
		gap: 10px;
		width: 880px;
		height: 635px;
	}
	.tile {
		position: relative;
		overflow: hidden;
		border-radius: 22px;
		background: #fff;
		border: 1px solid var(--line);
		box-shadow: 0 1px 2px rgba(16, 20, 30, .04), 0 16px 36px rgba(16, 20, 30, .06);
	}
	.tile.search { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; }
	.tile.search img { width: 696px; max-width: 100%; height: auto; }
	.tile img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: left top; }
	.materials { display: flex; flex-direction: column; gap: 4px; padding: 5px; min-width: 0; overflow: hidden; }
	.mat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
	.mat img {
		width: 100%; max-width: 100%; height: auto;
		border-radius: 14px;
		border: 1px solid rgba(16, 20, 30, .09);
		box-shadow: 0 10px 28px rgba(0, 0, 0, .12);
		background: #fff;
	}
	.mat span {
		font-family: "Noto Sans Mono CJK SC", ui-monospace, SFMono-Regular, monospace;
		font-size: 9px;
		line-height: 11px;
		letter-spacing: .16em;
		text-transform: uppercase;
		color: var(--muted);
		text-align: center;
	}
</style>
</head>
<body>
<div class="board">
	<section class="tile hero">
		<img src="../img/board-hero.webp" alt="Turn rail and preview card over the conversation">
	</section>

	<section class="tile materials">
		<div class="mat"><img src="../img/board-material-none.webp" alt="Opaque card"><span>none</span></div>
		<div class="mat"><img src="../img/board-material-frost.webp" alt="Frosted glass card"><span>frost</span></div>
		<div class="mat"><img src="../img/board-material-liquid.webp" alt="Liquid glass card"><span>liquid</span></div>
	</section>

	<section class="tile search">
		<img src="../img/board-search.webp" alt="⌘F search results over the conversation">
	</section>
</div>
<script>
	if (new URLSearchParams(location.search).get('lang') === 'en') {
		document.querySelectorAll('.board img').forEach((img) => {
			img.src = img.src.replace(/\.webp$/, '-en.webp');
		});
	}
</script>
</body>
</html>

# dsh-ui-outline — one loader row over the shipped Web composition:
# the node half registers the `outline` settings namespace with this row's
# config as its composition (base) layer; the browser half (dsh.client row)
# serves the navigation rail and the settings card.
- insert:
    - id: outline
      name: 'dsh-ui-outline'
      # Composition-layer defaults for the `outline` namespace. The settings
      # card's user layer always overrides these per user (and travels with
      # the account); profile owners may pin fleet-wide defaults here.
      config:
        side: right
        material: frost
        layout: compact
        frostTransparency: 50
        frostBlur: 12
        liquidTransparency: 50
        liquidBlur: 12

# dsh-ui-outline — one loader row. The row Config is the composition base;
# the browser half (platform: web, also what the desktop shell embeds)
# serves the rail and the settings card.
- insert:
    - id: outline
      name: 'dsh-ui-outline'
      # Composition-layer defaults. A saved user layer overrides these.
      config:
        side: right
        material: frost
        layout: compact
        frostTransparency: 80
        frostBlur: 6
        liquidTransparency: 75
        liquidBlur: 4
